<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ahmed A. Al-Ghamdi — IT Infrastructure Specialist at the National Transport Safety Center (NTSC) in Riyadh. Microsoft 365, Azure, cybersecurity, ITIL, ServiceNow, PMP, CEH.">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0A2625">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#04110F">
  <title>Ahmed A. Al-Ghamdi — IT Infrastructure Specialist · NTSC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      /* NTSC brand palette */
      --brand: #1F5D5A;
      --brand-dark: #134341;
      --brand-deep: #0A2625;
      --brand-light: #2E8C86;
      --accent: #6FE3CF;
      --surface: #FFFFFF;
      --surface-soft: #F6FAF9;
      --text: #0A2625;
      --text-muted: #5C7B79;
      --border: rgba(31, 93, 90, 0.16);
      --ring: rgba(31, 93, 90, 0.45);
      --radius-card: 24px;
      --radius-photo: 50%;
      --shadow-card: 0 24px 64px -16px rgba(10, 38, 37, 0.30), 0 4px 12px -2px rgba(10, 38, 37, 0.12);
      --shadow-photo: 0 12px 32px -8px rgba(31, 93, 90, 0.50);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(31, 93, 90, 0.10), transparent 60%),
        radial-gradient(900px 500px at 110% 110%, rgba(46, 140, 134, 0.10), transparent 55%),
        var(--surface-soft);
      color: var(--text);
      min-height: 100vh;
      padding: 48px 16px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .profile-header {
      max-width: min(1100px, 100%);
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      position: relative;
    }

    /* Tech-network banner in NTSC green */
    .banner {
      height: 200px;
      background:
        radial-gradient(800px 400px at 15% 10%, rgba(46, 140, 134, 0.14), transparent 55%),
        radial-gradient(600px 400px at 95% 90%, rgba(111, 227, 207, 0.06), transparent 60%),
        linear-gradient(135deg, #04110F 0%, #0A2422 55%, #133A37 100%);
      position: relative;
      overflow: hidden;
    }

    .banner svg.tech {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .content {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 36px;
      align-items: center;
      padding: 0 48px 40px;
      position: relative;
      z-index: 1;
    }

    .photo {
      width: 168px;
      height: 168px;
      border-radius: var(--radius-photo);
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-light) 100%);
      border: 4px solid var(--surface);
      outline: 2px solid var(--border);
      box-shadow: var(--shadow-photo);
      margin-top: -84px;
      display: grid;
      place-items: center;
      color: #fff;
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
      cursor: pointer;
    }

    .photo .upload-hint {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #fff;
      background: rgba(10, 38, 37, 0.55);
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .photo .upload-hint svg {
      width: 22px;
      height: 22px;
      stroke: #fff;
      fill: none;
    }

    .photo:hover .upload-hint,
    .photo:focus-within .upload-hint { opacity: 1; }

    .photo:focus-within {
      outline-color: var(--ring);
      outline-offset: 4px;
    }

    .photo .initials {
      font-size: 3.5rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-shadow: 0 2px 8px rgba(10, 38, 37, 0.25);
    }

    .photo img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 25%;
      display: block;
    }

    .info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 12px;
      min-width: 0;
      overflow-wrap: break-word;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--brand);
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(31, 93, 90, 0.08);
      border: 1px solid rgba(31, 93, 90, 0.18);
      width: fit-content;
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }

    .badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--brand-light);
      box-shadow: 0 0 0 3px rgba(46, 140, 134, 0.25);
    }

    .name {
      font-size: clamp(1.6rem, 3.6vw, 2.5rem);
      font-weight: 800;
      letter-spacing: 0.02em;
      line-height: 1.1;
      color: var(--text);
    }

    .title {
      font-size: clamp(0.95rem, 1.6vw, 1.125rem);
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--brand);
      margin-top: 10px;
    }

    .headline {
      font-size: clamp(0.9rem, 1.4vw, 1.0625rem);
      font-weight: 500;
      line-height: 1.6;
      color: var(--text);
      margin-top: 8px;
      max-width: 72ch;
      overflow-wrap: break-word;
    }

    .headline .sep {
      color: var(--brand-light);
      font-weight: 400;
      margin: 0 4px;
      opacity: 0.7;
    }

    .org-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .org-line .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .org-line strong {
      color: var(--text);
      font-weight: 600;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
    }

    .url, .location {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.92rem;
      color: var(--text-muted);
      text-decoration: none;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }

    .url {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.88rem;
    }

    .url:hover {
      color: var(--text);
      border-color: var(--ring);
      background: rgba(31, 93, 90, 0.06);
      transform: translateY(-1px);
    }

    .url:focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
    }

    .url svg, .location svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .url svg { fill: var(--brand); }
    .location svg { fill: var(--text-muted); }

    @media (max-width: 720px) {
      .content {
        grid-template-columns: minmax(0, 1fr);
        text-align: center;
        padding: 0 24px 32px;
        gap: 16px;
        justify-items: center;
      }
      .photo {
        width: 128px;
        height: 128px;
        margin-top: -64px;
      }
      .info {
        align-items: center;
        padding-top: 0;
      }
      .meta {
        flex-direction: column;
        align-items: stretch;
        width: 100%;
      }
      .url, .location {
        justify-content: center;
        max-width: 100%;
      }
      .badge {
        margin: 0 auto 4px;
      }
      .headline {
        max-width: 100%;
        text-align: center;
      }
      .banner {
        height: 130px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .url, .location {
        transition: none;
      }
      .url:hover {
        transform: none;
      }
      .photo .upload-hint {
        transition: none;
      }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #0F2725;
        --surface-soft: #061614;
        --text: #E6F4F1;
        --text-muted: #8FAEAB;
        --brand: #6FE3CF;
        --border: rgba(111, 227, 207, 0.16);
        --ring: rgba(111, 227, 207, 0.55);
        --shadow-card: 0 24px 64px -16px rgba(0, 0, 0, 0.65), 0 4px 12px -2px rgba(0, 0, 0, 0.45);
        --shadow-photo: 0 12px 32px -8px rgba(0, 0, 0, 0.55);
      }

      body {
        background:
          radial-gradient(1200px 600px at 10% -10%, rgba(46, 140, 134, 0.18), transparent 60%),
          radial-gradient(900px 500px at 110% 110%, rgba(111, 227, 207, 0.08), transparent 55%),
          var(--surface-soft);
      }

      .badge {
        background: rgba(111, 227, 207, 0.10);
        border-color: rgba(111, 227, 207, 0.22);
      }

      .url:hover {
        background: rgba(111, 227, 207, 0.10);
      }

      .org-line strong {
        color: var(--text);
      }
    }

    @media print {
      body {
        background: #fff;
        padding: 0;
      }
      .profile-header {
        border: none;
        box-shadow: none;
      }
      .banner {
        height: 80px;
      }
      .photo {
        box-shadow: none;
        outline: 1px solid var(--border);
      }
      .url, .location {
        border-color: var(--border);
      }
    }
  </style>
</head>
<body>
  <article class="profile-header" aria-label="Ahmed A. Al-Ghamdi profile header">
    <div class="banner" aria-hidden="true">
      <svg class="tech" viewBox="0 0 1100 200" preserveAspectRatio="xMidYMid slice">
        <defs>
          <pattern id="dotGrid" width="9" height="9" patternUnits="userSpaceOnUse">
            <circle cx="4.5" cy="4.5" r="1.1" fill="rgba(195, 235, 225, 0.55)"/>
          </pattern>
          <clipPath id="globeClip">
            <circle cx="920" cy="100" r="160"/>
          </clipPath>
          <radialGradient id="globeGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="rgba(111, 227, 207, 0.18)"/>
            <stop offset="60%" stop-color="rgba(111, 227, 207, 0.05)"/>
            <stop offset="100%" stop-color="rgba(111, 227, 207, 0)"/>
          </radialGradient>
        </defs>

        <!-- Circuit traces -->
        <g fill="none" stroke="#5BC3BC" stroke-width="1" opacity="0.55">
          <path d="M-20,28 L140,28 L140,48 L300,48 L300,62 L420,62"/>
          <path d="M-20,68 L90,68 L90,90 L220,90 L220,108 L360,108"/>
          <path d="M-20,108 L60,108 L60,138 L180,138 L180,158 L320,158"/>
          <path d="M-20,148 L120,148 L120,172 L280,172"/>
          <path d="M-20,180 L80,180 L80,200"/>
          <path d="M380,30 L460,30 L460,55 L540,55"/>
          <path d="M440,80 L520,80 L520,110 L620,110"/>
          <path d="M400,140 L500,140 L500,165 L580,165"/>
          <path d="M580,25 L660,25 L660,50 L740,50"/>
        </g>

        <!-- Trace node markers -->
        <g fill="#6FE3CF" opacity="0.75">
          <rect x="417" y="59" width="6" height="6" transform="rotate(45 420 62)"/>
          <rect x="357" y="105" width="6" height="6" transform="rotate(45 360 108)"/>
          <rect x="317" y="155" width="6" height="6" transform="rotate(45 320 158)"/>
          <rect x="277" y="169" width="6" height="6" transform="rotate(45 280 172)"/>
          <rect x="537" y="52" width="6" height="6" transform="rotate(45 540 55)"/>
          <rect x="617" y="107" width="6" height="6" transform="rotate(45 620 110)"/>
          <rect x="577" y="162" width="6" height="6" transform="rotate(45 580 165)"/>
          <rect x="737" y="47" width="6" height="6" transform="rotate(45 740 50)"/>
        </g>

        <!-- Trace junction dots -->
        <g fill="#5BC3BC" opacity="0.6">
          <circle cx="140" cy="28" r="2"/>
          <circle cx="300" cy="48" r="2"/>
          <circle cx="90" cy="68" r="2"/>
          <circle cx="220" cy="90" r="2"/>
          <circle cx="60" cy="108" r="2"/>
          <circle cx="180" cy="138" r="2"/>
          <circle cx="120" cy="148" r="2"/>
          <circle cx="460" cy="30" r="2"/>
          <circle cx="520" cy="80" r="2"/>
          <circle cx="500" cy="140" r="2"/>
          <circle cx="660" cy="25" r="2"/>
        </g>

        <!-- Globe glow -->
        <circle cx="920" cy="100" r="180" fill="url(#globeGlow)"/>

        <!-- Sphere wireframe -->
        <g transform="translate(920 100)" fill="none" stroke="#2E8C86" stroke-width="0.8" opacity="0.45">
          <circle r="160"/>
          <ellipse rx="160" ry="45"/>
          <ellipse rx="160" ry="95"/>
          <ellipse rx="160" ry="130"/>
          <ellipse rx="45" ry="160"/>
          <ellipse rx="95" ry="160"/>
          <ellipse rx="130" ry="160"/>
        </g>

        <!-- Sphere dot grid -->
        <rect x="760" y="-60" width="320" height="320" fill="url(#dotGrid)" clip-path="url(#globeClip)"/>

        <!-- Highlight data nodes on globe -->
        <g fill="#6FE3CF">
          <circle cx="845" cy="55" r="2.5"/>
          <circle cx="880" cy="40" r="2"/>
          <circle cx="935" cy="48" r="3"/>
          <circle cx="980" cy="70" r="2"/>
          <circle cx="1010" cy="100" r="2.5"/>
          <circle cx="990" cy="135" r="2"/>
          <circle cx="940" cy="160" r="3"/>
          <circle cx="880" cy="155" r="2"/>
          <circle cx="830" cy="125" r="2.5"/>
          <circle cx="820" cy="85" r="2"/>
          <circle cx="900" cy="100" r="3.5"/>
        </g>

        <!-- Connection lines from circuit to globe -->
        <g stroke="#5BC3BC" stroke-width="0.8" fill="none" opacity="0.35">
          <path d="M740,50 L820,85"/>
          <path d="M580,165 L830,125"/>
        </g>
      </svg>
    </div>

    <div class="content">
      <label class="photo" aria-label="Upload profile photo">
        <span class="initials" aria-hidden="true">AG</span>
        <img id="profile-img" src="profile.jpg" alt="Ahmed A. Al-Ghamdi" onerror="this.remove();">
        <span class="upload-hint" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Upload photo
        </span>
        <input id="profile-input" type="file" accept="image/*" hidden>
      </label>

      <div class="info">
        <span class="badge">Open to opportunities</span>
        <h1 class="name">AHMED A. AL-GHAMDI</h1>
        <p class="title">IT Infrastructure Specialist</p>

        <p class="headline">
          Microsoft 365 &amp; Azure
          <span class="sep">|</span> Cybersecurity &amp; Compliance
          <span class="sep">|</span> ITIL &amp; ServiceNow
          <span class="sep">|</span> Digital Transformation
          <span class="sep">|</span> PMP
          <span class="sep">|</span> CEH
        </p>

        <p class="org-line">
          <strong>National Transport Safety Center (NTSC)</strong>
          <span class="dot" aria-hidden="true"></span>
          <span>Riyadh, Saudi Arabia</span>
        </p>

        <div class="meta">
          <a class="url" href="https://www.linkedin.com/in/ahmedfidi" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile: linkedin.com/in/ahmedfidi">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.47-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"/>
            </svg>
            linkedin.com/in/ahmedfidi
          </a>
          <span class="location" aria-label="Location">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
            </svg>
            Riyadh, KSA
          </span>
        </div>
      </div>
    </div>
  </article>

  <script>
    (() => {
      const input = document.getElementById('profile-input');
      const photo = document.querySelector('.photo');
      input.addEventListener('change', () => {
        const file = input.files && input.files[0];
        if (!file) return;
        let img = document.getElementById('profile-img');
        if (!img) {
          img = document.createElement('img');
          img.id = 'profile-img';
          img.alt = 'Ahmed A. Al-Ghamdi';
          photo.insertBefore(img, photo.querySelector('.upload-hint'));
        }
        img.src = URL.createObjectURL(file);
      });
    })();
  </script>
</body>
</html>
