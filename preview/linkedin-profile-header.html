<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ahmef — IT Infrastructure Specialist · NTSC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      /* NTSC brand-inspired palette */
      --brand: #1F5D5A;
      --brand-dark: #134341;
      --brand-deep: #0B2C2B;
      --brand-light: #2E8C86;
      --accent: #D4AF37;
      --surface: #FFFFFF;
      --surface-soft: #F7F9F8;
      --text: #0B2C2B;
      --text-muted: #5C7B79;
      --border: rgba(31, 93, 90, 0.16);
      --ring: rgba(31, 93, 90, 0.45);
      --radius-card: 24px;
      --radius-photo: 50%;
      --shadow-card: 0 24px 64px -16px rgba(11, 44, 43, 0.25), 0 4px 12px -2px rgba(11, 44, 43, 0.10);
      --shadow-photo: 0 12px 32px -8px rgba(31, 93, 90, 0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; }

    body {
      font-family: 'Inter', 'IBM Plex Sans Arabic', -apple-system, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(31, 93, 90, 0.10), transparent 60%),
        radial-gradient(900px 500px at 110% 110%, rgba(46, 140, 134, 0.10), transparent 55%),
        var(--surface-soft);
      color: var(--text);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 24px;
      -webkit-font-smoothing: antialiased;
    }

    .profile-header {
      width: 100%;
      max-width: 1100px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      position: relative;
    }

    /* Banner with NTSC green + subtle palm-shield motif */
    .banner {
      height: 168px;
      background:
        linear-gradient(135deg, var(--brand-deep) 0%, var(--brand) 55%, var(--brand-light) 100%);
      position: relative;
      overflow: hidden;
    }

    .banner::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at 80% 20%, black 30%, transparent 75%);
    }

    .banner::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(420px 160px at 12% 100%, rgba(255,255,255,0.10), transparent 60%),
        radial-gradient(360px 180px at 88% 0%, rgba(212, 175, 55, 0.18), transparent 60%);
    }

    /* NTSC corner badge */
    .org-badge {
      position: absolute;
      top: 20px;
      right: 24px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px 8px 8px;
      background: rgba(255, 255, 255, 0.96);
      border-radius: 12px;
      box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.35);
      z-index: 2;
    }
    .org-badge .shield {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      background: var(--brand);
      display: grid;
      place-items: center;
      color: #fff;
      font-weight: 800;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
    }
    .org-badge .org-text {
      line-height: 1.1;
    }
    .org-badge .org-en {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--brand);
      letter-spacing: 0.04em;
    }
    .org-badge .org-ar {
      font-family: 'IBM Plex Sans Arabic', 'Inter', sans-serif;
      font-size: 0.7rem;
      color: var(--text-muted);
      direction: rtl;
    }

    .content {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 36px;
      align-items: center;
      padding: 0 48px 40px;
      position: relative;
      z-index: 1;
    }

    .photo {
      width: 168px;
      height: 168px;
      border-radius: var(--radius-photo);
      background:
        linear-gradient(135deg, rgba(46, 140, 134, 0.20), rgba(31, 93, 90, 0.30)),
        var(--surface-soft);
      border: 4px solid var(--surface);
      outline: 2px solid var(--border);
      box-shadow: var(--shadow-photo);
      margin-top: -84px;
      display: grid;
      place-items: center;
      color: var(--brand);
      flex-shrink: 0;
      overflow: hidden;
      position: relative;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo .placeholder {
      width: 64px;
      height: 64px;
      opacity: 0.55;
    }

    .info {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 12px;
      min-width: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--brand);
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(31, 93, 90, 0.08);
      border: 1px solid rgba(31, 93, 90, 0.18);
      width: fit-content;
      margin-bottom: 6px;
      letter-spacing: 0.02em;
    }

    .badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--brand-light);
      box-shadow: 0 0 0 3px rgba(46, 140, 134, 0.25);
    }

    .name {
      font-size: clamp(2rem, 4.5vw, 3rem);
      font-weight: 800;
      letter-spacing: 0.01em;
      line-height: 1.05;
      color: var(--text);
    }

    .name-ar {
      font-family: 'IBM Plex Sans Arabic', 'Inter', sans-serif;
      font-size: clamp(1rem, 1.8vw, 1.25rem);
      font-weight: 500;
      color: var(--text-muted);
      direction: rtl;
      margin-top: 2px;
    }

    .title {
      font-size: clamp(0.95rem, 1.6vw, 1.125rem);
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--brand);
      margin-top: 10px;
    }

    .org-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .org-line .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .org-line strong {
      color: var(--text);
      font-weight: 600;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
    }

    .url, .location {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 0.92rem;
      color: var(--text-muted);
      text-decoration: none;
      padding: 8px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }

    .url {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.88rem;
    }

    .url:hover {
      color: var(--text);
      border-color: var(--ring);
      background: rgba(31, 93, 90, 0.06);
      transform: translateY(-1px);
    }

    .url:focus-visible {
      outline: 2px solid var(--ring);
      outline-offset: 2px;
    }

    .url svg, .location svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .url svg { fill: var(--brand); }
    .location svg { fill: var(--text-muted); }

    @media (max-width: 720px) {
      .content {
        grid-template-columns: 1fr;
        text-align: center;
        padding: 0 24px 32px;
        gap: 16px;
        justify-items: center;
      }
      .photo {
        width: 128px;
        height: 128px;
        margin-top: -64px;
      }
      .info {
        align-items: center;
        padding-top: 0;
      }
      .meta {
        justify-content: center;
      }
      .badge {
        margin: 0 auto 4px;
      }
      .banner {
        height: 130px;
      }
      .org-badge {
        top: 12px;
        right: 12px;
        padding: 6px 10px 6px 6px;
      }
    }
  </style>
</head>
<body>
  <article class="profile-header" aria-label="Ahmef profile header">
    <div class="banner" aria-hidden="true">
      <div class="org-badge" aria-label="National Transport Safety Center">
        <span class="shield">NT</span>
        <span class="org-text">
          <span class="org-en">NTSC</span><br>
          <span class="org-ar">المركز الوطني لسلامة النقل</span>
        </span>
      </div>
    </div>

    <div class="content">
      <div class="photo" role="img" aria-label="Profile photo of Ahmef">
        <!-- Drop ahmef.jpg in this folder to use the real photo -->
        <img src="ahmef.jpg" alt="Ahmef" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
        <svg class="placeholder" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none;">
          <path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.4c-3.3 0-9.8 1.6-9.8 4.9V22h19.6v-2.7c0-3.3-6.5-4.9-9.8-4.9z"/>
        </svg>
      </div>

      <div class="info">
        <span class="badge">Open to opportunities</span>
        <h1 class="name">Ahmef</h1>
        <p class="name-ar">أحمف</p>
        <p class="title">IT Infrastructure Specialist</p>

        <p class="org-line">
          <strong>National Transport Safety Center (NTSC)</strong>
          <span class="dot" aria-hidden="true"></span>
          <span>Riyadh, Saudi Arabia</span>
        </p>

        <div class="meta">
          <a class="url" href="https://linkedin.com/in/yourhandle" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.47-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"/>
            </svg>
            linkedin.com/in/yourhandle
          </a>
          <span class="location" aria-label="Location">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/>
            </svg>
            Riyadh, KSA
          </span>
        </div>
      </div>
    </div>
  </article>
</body>
</html>
